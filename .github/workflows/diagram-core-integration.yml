name: Experimental diagram-core integration
on:
  pull_request:
    paths:
      - 'app.py'
      - 'templates/repository.html'
      - 'tests/test_diagram_core_export.py'
      - '.github/workflows/diagram-core-integration.yml'
  push:
    paths:
      - 'app.py'
      - 'templates/repository.html'
      - 'tests/test_diagram_core_export.py'
      - '.github/workflows/diagram-core-integration.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest tests/test_diagram_core_export.py -q
