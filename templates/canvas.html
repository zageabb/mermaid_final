{% extends "base.html" %}

{% block content %}
<div class="bg-white border-bottom px-3 py-2 d-flex align-items-center justify-content-between">
    <div class="d-flex align-items-center gap-2 overflow-hidden">
        <span class="badge text-bg-primary">Active Canvas</span>
        <h1 class="h5 mb-0 text-truncate" id="activeWorkspaceTitle">{{ current_name }}</h1>
    </div>
    <button type="button" class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#saveModal">Save State</button>
</div>

<iframe id="mermaidFrame" class="canvas-frame" src="{{ current_url }}"></iframe>

<div class="modal fade" id="saveModal" tabindex="-1" aria-labelledby="saveModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form action="{{ url_for('save_diagram') }}" method="POST">
                <div class="modal-header">
                    <h2 class="modal-title h5" id="saveModalLabel">Save Current Diagram State</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="url" id="hiddenUrlInput">
                    <div class="mb-3">
                        <label for="description" class="form-label fw-semibold">Diagram Description</label>
                        <input type="text" class="form-control" id="description" name="description" required>
                    </div>
                    <div class="mb-3">
                        <label for="notes" class="form-label fw-semibold">Notes</label>
                        <textarea class="form-control" id="notes" name="notes" rows="4"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Diagram</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('saveModal').addEventListener('show.bs.modal', function () {
        const iframe = document.getElementById('mermaidFrame');
        const title = document.getElementById('activeWorkspaceTitle').innerText;
        const urlInput = document.getElementById('hiddenUrlInput');
        const description = document.getElementById('description');

        try {
            urlInput.value = iframe.contentWindow.location.href;
        } catch (error) {
            urlInput.value = iframe.src;
        }

        description.value = title && title !== 'New Diagram Canvas' ? title : '';
    });
</script>
{% endblock %}
