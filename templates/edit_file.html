{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <div class="d-flex align-items-center justify-content-between gap-3 mb-3">
        <div class="overflow-hidden">
            <h1 class="h3 mb-1 text-truncate">Edit Source</h1>
            <div class="file-path text-muted text-truncate">{{ filename }}</div>
        </div>
        <a class="btn btn-outline-secondary" href="{{ url_for('repository') }}">Cancel</a>
    </div>

    <form method="POST">
        <textarea class="form-control code-editor" name="code" spellcheck="false">{{ content }}</textarea>
        <div class="d-flex justify-content-end mt-3">
            <button type="submit" class="btn btn-primary">Save File</button>
        </div>
    </form>
</div>
{% endblock %}
