<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mermaid Final</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html, body { height: 100%; }
        body { background: #f5f7fb; color: #1f2937; }
        .navbar { min-height: 56px; }
        .app-shell { min-height: calc(100vh - 56px); }
        .table-fixed { table-layout: fixed; }
        .file-path { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .85rem; }
        .child-file td:first-child { padding-left: 2rem; }
        .toolbar { gap: .5rem; }
        .diagram-stage { height: calc(100vh - 57px); background: #fbfcfe; overflow: hidden; }
        .code-editor { min-height: 60vh; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; line-height: 1.5; }
        .editor-workbench { --source-width: 42%; --assistant-width: 360px; height: calc(100vh - 105px); display: grid; grid-template-columns: minmax(280px, var(--source-width)) 6px minmax(320px, 1fr) 6px minmax(300px, var(--assistant-width)); overflow: hidden; }
        .editor-workbench.has-metadata { height: calc(100vh - 200px); }
        .editor-workbench.assistant-collapsed { grid-template-columns: minmax(280px, var(--source-width)) 6px minmax(320px, 1fr) 0 0; }
        .source-pane, .preview-pane, .assistant-pane { min-height: 0; border-right: 1px solid #dbe1ea; }
        .split-handle { background: #e5eaf1; cursor: col-resize; min-width: 6px; }
        .split-handle:hover, .split-handle.dragging { background: #8aa4c7; }
        .source-pane textarea { height: 100%; resize: none; border: 0; border-radius: 0; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .9rem; line-height: 1.45; }
        .preview-surface { height: 100%; overflow: hidden; background: #fbfcfe; position: relative; cursor: grab; }
        .preview-surface.dragging { cursor: grabbing; }
        .preview-box { min-height: 100%; width: 100%; transform-origin: 0 0; display: flex; align-items: center; justify-content: center; padding: 1rem; }
        .preview-tools { position: absolute; top: .75rem; right: .75rem; z-index: 2; }
        .assistant-pane { background: #fff; overflow: hidden; display: flex; flex-direction: column; }
        .assistant-collapsed .assistant-pane { display: none; }
        .assistant-log { flex: 1; overflow: auto; background: #f8fafc; }
        .help-panel { min-height: 230px; max-height: 260px; overflow: auto; border-top: 1px solid #dbe1ea; background: #fff; }
        .help-panel code { color: #0f5132; }
        .help-panel ul { margin-bottom: .5rem; padding-left: 1.1rem; }
        @media (max-width: 992px) {
            .editor-workbench, .editor-workbench.assistant-collapsed { height: auto; min-height: calc(100vh - 105px); display: block; overflow: visible; }
            .split-handle { display: none; }
            .source-pane textarea { height: 45vh; }
            .preview-surface { height: 45vh; }
            .assistant-pane { height: 420px; }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
        <a class="navbar-brand fw-semibold" href="{{ url_for('canvas') }}">Mermaid Final</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="{{ url_for('canvas') }}">Canvas</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('repository') }}">File Repository</a></li>
            </ul>
            <span class="navbar-text small text-light-emphasis">Ollama: {{ ollama_model }}</span>
        </div>
    </nav>

    <main class="app-shell">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="container-fluid pt-3">
                    {% for message in messages %}
                        <div class="alert alert-info mb-2">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
